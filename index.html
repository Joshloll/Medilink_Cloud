<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediLink Cloud - Healthcare Platform</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
    
    <style>
        body {
            transition: background-color 0.2s, color 0.2s;
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-50 font-display transition-colors duration-200 overflow-hidden">
    
    <!-- Main App Container -->
    <div id="app" class="flex h-screen w-full">
        <!-- Sidebar Container -->
        <aside id="sidebar" class="hidden"></aside>
        
        <!-- Main Content -->
        <div class="flex-1 flex flex-col h-full overflow-hidden">
            <!-- Top Navigation -->
            <header id="topnav" class="hidden h-16 flex-shrink-0"></header>
            
            <!-- Page Content -->
            <main id="main-content" class="flex-1 overflow-y-auto">
                <!-- Dynamic content rendered here -->
            </main>
        </div>
    </div>
    
    <!-- Toast Notifications Container -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 space-y-2"></div>
    
    <!-- Modal Container -->
    <div id="modal-container" class="fixed inset-0 hidden z-40"></div>

    <!-- Application Scripts -->
    <script src="js/state.js"></script>
    <script src="js/api.js"></script>
    <script src="js/modules/appointments.js"></script>
    <script src="js/modules/auth.js"></script>
    <script src="js/modules/admin.js"></script>
    <script src="js/modules/doctor.js"></script>
    <script src="js/modules/patient.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
